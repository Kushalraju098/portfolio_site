<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FinSight AI system flow</title>
  <desc id="desc">A question passes input checks and a LangGraph router, then uses SEC filing retrieval, market-data tools, or both before evidence-grounded synthesis and output checks.</desc>
  <rect width="1200" height="630" fill="#f4f7fb"/>
  <text x="72" y="68" fill="#315fd4" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">FINSIGHT AI · SYSTEM FLOW</text>
  <text x="72" y="111" fill="#172238" font-family="Arial, sans-serif" font-size="30" font-weight="700">One question. The right evidence path.</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="158" width="220" height="86" rx="10" fill="#fff" stroke="#cbd5e3" stroke-width="2"/>
    <text x="96" y="194" fill="#718099" font-size="13" font-weight="700" letter-spacing="1.2">INPUT</text>
    <text x="96" y="222" fill="#172238" font-size="20" font-weight="700">Financial question</text>

    <path d="M292 201h54" stroke="#8292aa" stroke-width="3"/>
    <path d="m336 192 12 9-12 9" fill="none" stroke="#8292aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="352" y="158" width="220" height="86" rx="10" fill="#fff" stroke="#cbd5e3" stroke-width="2"/>
    <text x="376" y="194" fill="#718099" font-size="13" font-weight="700" letter-spacing="1.2">GUARDRAILS</text>
    <text x="376" y="222" fill="#172238" font-size="20" font-weight="700">Input checks</text>

    <path d="M572 201h54" stroke="#8292aa" stroke-width="3"/>
    <path d="m616 192 12 9-12 9" fill="none" stroke="#8292aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="632" y="158" width="220" height="86" rx="10" fill="#e9efff" stroke="#aabcf0" stroke-width="2"/>
    <text x="656" y="194" fill="#315fd4" font-size="13" font-weight="700" letter-spacing="1.2">ORCHESTRATION</text>
    <text x="656" y="222" fill="#172238" font-size="20" font-weight="700">LangGraph router</text>

    <path d="M742 244v38M742 282H360v30M742 282h380v30" fill="none" stroke="#8292aa" stroke-width="3"/>
    <path d="m352 300 8 13 8-13M1114 300l8 13 8-13" fill="none" stroke="#8292aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="72" y="316" width="520" height="112" rx="10" fill="#fff" stroke="#c9dfce" stroke-width="2"/>
    <rect x="72" y="316" width="8" height="112" rx="4" fill="#4b9b64"/>
    <text x="104" y="355" fill="#3d8554" font-size="13" font-weight="700" letter-spacing="1.2">RAG · SEC FILINGS</text>
    <text x="104" y="387" fill="#172238" font-size="21" font-weight="700">Retrieve indexed filing evidence</text>
    <text x="104" y="411" fill="#56647a" font-size="15">Query analysis → embeddings → Pinecone</text>

    <rect x="632" y="316" width="496" height="112" rx="10" fill="#fff" stroke="#dacdf0" stroke-width="2"/>
    <rect x="632" y="316" width="8" height="112" rx="4" fill="#8c69bd"/>
    <text x="664" y="355" fill="#7753aa" font-size="13" font-weight="700" letter-spacing="1.2">MCP · MARKET RESEARCH</text>
    <text x="664" y="387" fill="#172238" font-size="21" font-weight="700">Call financial data tools</text>
    <text x="664" y="411" fill="#56647a" font-size="15">Prices · price history · company news</text>

    <path d="M332 428v34h268M880 428v34H600" fill="none" stroke="#8292aa" stroke-width="3"/>
    <path d="m592 454 8 9 8-9" fill="none" stroke="#8292aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="224" y="470" width="752" height="104" rx="10" fill="#172238"/>
    <text x="260" y="510" fill="#9eb7ff" font-size="13" font-weight="700" letter-spacing="1.2">RESPONSE</text>
    <text x="260" y="543" fill="#fff" font-size="22" font-weight="700">Evidence synthesis + output checks</text>
    <text x="690" y="543" fill="#c3ccdc" font-size="15">Grounded answer</text>
  </g>
</svg>
